<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Tracker</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; text-align: center; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background-color: #0056b3; }
        #departure-view { display: none; } /* Hidden until you park */
        #directions-text { text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.5; }
        #loading { display: none; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="container" id="arrival-view">
        <h2>Park My Car</h2>
        <input type="text" id="building-name" placeholder="E.g., VivoCity">
        <!-- This input automatically opens the mobile camera -->
        <input type="file" id="camera-input" accept="image/*" capture="environment">
        <button onclick="saveParking()">Save Parking Spot</button>
        <p id="loading">Asking AI for directions... Please wait.</p>
    </div>

    <div class="container" id="departure-view">
        <h2>Find My Car</h2>
        <div id="directions-text"></div>
        <button onclick="retrieveCar()" style="background-color: #28a745;">Found My Car</button>
        <p id="cost-estimate" style="font-weight: bold; font-size: 1.2em; color: #d9534f;"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
